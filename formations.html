<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>フォーメーション作成</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/editor.js"></script>
</head>
<body class="editor-page">
  <header class="app-header">
    <h1>フォーメーション作成</h1>
    <span class="spacer"></span>
    <button type="button" class="mode-badge" hidden>サンプルデータ</button>
    <button type="button" class="header-link" data-action="settings">接続設定</button>
    <a class="header-link" href="index.html">戦術ボードへ戻る</a>
  </header>

  <p class="pc-only-note">フォーメーション作成は PC で行ってください。</p>

  <main class="editor-layout">
    <section class="panel formation-list" aria-label="登録済みフォーメーション">
      <button type="button" class="new-btn" data-action="new">＋ 新規作成</button>
      <ul></ul>
    </section>

    <section class="board" aria-label="選手配置">
      <form class="editor-bar" autocomplete="off">
        <label>フォーメーション名
          <input type="text" name="name" maxlength="20" placeholder="例: 4-4-2" required>
        </label>
        <button type="submit" class="primary">登録</button>
        <span class="editor-mode"></span>
        <span class="editor-error" role="alert"></span>
      </form>
      <div class="pitch-wrap">
        <svg id="pitch" role="img" aria-label="選手配置エリア"></svg>
      </div>
      <p class="editor-help">アイコンをドラッグして配置します。1 は GK の配置枠です。ホームが右へ攻める向き(コート上側がそのチームの左サイド)で作ってください。</p>
    </section>
  </main>

  <p id="status" class="status" role="status"></p>
</body>
</html>
